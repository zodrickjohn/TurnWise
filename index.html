<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solve your 2×2, 3×3, 4×4 or 5×5 cube step by step: paint or scan your cube, then learn it the beginner, intermediate or expert way." />
    <title>Turnwise: learn to solve your cube</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'><rect width='30' height='30' rx='6' fill='%23000000'/><rect x='3' y='3' width='7' height='7' rx='2' fill='%23ffd60a'/><rect x='11.5' y='3' width='7' height='7' rx='2' fill='%23ff7a00'/><rect x='20' y='3' width='7' height='7' rx='2' fill='%2300a35a'/><rect x='3' y='11.5' width='7' height='7' rx='2' fill='%231f5bff'/><rect x='11.5' y='11.5' width='7' height='7' rx='2' fill='%23f4f5f1'/><rect x='20' y='11.5' width='7' height='7' rx='2' fill='%23e1262d'/><rect x='3' y='20' width='7' height='7' rx='2' fill='%2300a35a'/><rect x='11.5' y='20' width='7' height='7' rx='2' fill='%23ffd60a'/><rect x='20' y='20' width='7' height='7' rx='2' fill='%231f5bff'/></svg>" />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('turnwise.theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') } catch { document.documentElement.dataset.theme = 'light' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend+Mega:wght@700..900&display=swap" rel="stylesheet" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
